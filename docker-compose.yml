services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_dev_password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis-primary:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/primary.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_primary_data:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis-replica:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_replica_data:/data
    ports: ["6380:6379"]
    depends_on:
      redis-primary: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]
  firestore-emulator:
    profiles: ["dev"]
    build: ./firestore
    environment:
      FIRESTORE_PROJECT_ID: cinema-lab-local
    ports: ["8080:8080", "4000:4000"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinema}:${POSTGRES_PASSWORD:-cinema_dev_password}@db:5432/${POSTGRES_DB:-cinema}
      REDIS_PRIMARY_URL: redis://redis-primary:6379/0
      REDIS_REPLICA_URL: redis://redis-replica:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-long-random-key-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cinema.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminDemo123!}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-cinema@local.test}
      CORS_ORIGINS: http://localhost:3000
      REDIS_REPLICA_HOST: redis-primary
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-cinema-lab-local}
      FIRESTORE_MODE: ${FIRESTORE_MODE:-emulator}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-firestore-emulator:8080}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./backend:/code
      - ./scripts:/scripts
      - ./secrets:/run/secrets:ro
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis-primary: {condition: service_healthy}
      redis-replica: {condition: service_healthy}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_primary_data:
  redis_replica_data:
